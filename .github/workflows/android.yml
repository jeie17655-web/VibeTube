name: VibeTube Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle
        run: ./gradlew --version
      - name: Unit tests
        run: ./gradlew test
      - name: Debug APK
        run: ./gradlew assembleDebug
